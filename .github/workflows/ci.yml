name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # L'outil passé sur lui-même, comme un projet qui l'emploie (sans publier).
      - uses: ./
        with:
          publish: 'false'
          setup-node: 'false'
